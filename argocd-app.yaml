apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: live-auction-platform-all
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/isuruamarasooriya/real-time-live-auction-platform.git'
    path: k8s
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
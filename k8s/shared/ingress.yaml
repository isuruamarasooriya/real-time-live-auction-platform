apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: live-auction-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  rules:
  - http:
      paths:
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: bidding-engine-svc
            port:
              number: 80
      - path: /api/bidding
        pathType: Prefix
        backend:
          service:
            name: bidding-engine-svc
            port:
              number: 80
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 5001
      - path: /api/catalog
        pathType: Prefix
        backend:
          service:
            name: catalog-service
            port:
              number: 5002
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
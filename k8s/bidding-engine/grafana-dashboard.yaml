apiVersion: v1
kind: ConfigMap
metadata:
  name: bidding-engine-dashboard
  labels:
    grafana_dashboard: "1" 
data:
  bidding-engine.json: |-
    {
      "title": "Bidding Engine Dashboard",
      "panels": [
        {
          "type": "timeseries",
          "title": "HTTP Requests Per Second",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{container=\"bidding-engine\"}[5m]))",
              "legendFormat": "Request Rate"
            }
          ]
        }
      ]
    }
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidding-engine
  labels:
    app: bidding-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bidding-engine
  template:
    metadata:
      labels:
        app: bidding-engine
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: bidding-engine
        image: isuruamarasooriya/bidding-engine:1
        ports:
        - containerPort: 5003
        env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: mongo-uri
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"